services:
  repo-growth-monitor:
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/rgm-runtime.yml
    volumes:
      - ./deploy/tmp/rgm-runtime.local.yml:/app/rgm-runtime.yml:ro

  collector:
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/collector-runtime.yml
    volumes:
      - ./deploy/tmp/collector-runtime.local.yml:/app/collector-runtime.yml:ro
