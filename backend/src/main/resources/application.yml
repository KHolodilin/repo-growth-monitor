spring:
  application:
    name: repo-growth-monitor
  banner:
    location: classpath:banner.txt
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://localhost:5432/repogrowth
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    user: ${LIQUIBASE_USER:${spring.datasource.username}}
    password: ${LIQUIBASE_PASSWORD:${spring.datasource.password}}
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${AUTH_COOKIE_SECURE:false}
      timeout: ${AUTH_SESSION_IDLE:8h}

app:
  timezone: UTC
  base-url: ${APP_BASE_URL:}
  site-domain: ${SITE_DOMAIN:}

auth:
  provider: ${AUTH_PROVIDER:}
  production: ${AUTH_PRODUCTION:false}
  session-idle: ${AUTH_SESSION_IDLE:8h}
  session-absolute: ${AUTH_SESSION_ABSOLUTE:24h}
  oidc:
    issuer-uri: ${AUTH_OIDC_ISSUER_URI:}
    client-id: ${AUTH_OIDC_CLIENT_ID:}
    client-secret: ${AUTH_OIDC_CLIENT_SECRET:}
    redirect-uri: ${AUTH_OIDC_REDIRECT_URI:}
    scope: ${AUTH_OIDC_SCOPE:openid profile email}
  mock:
    users-location: ${AUTH_MOCK_USERS_LOCATION:classpath:auth/mock-users.yml}

collection:
  # workers/job-lease remain for configuration binding; in-process workers were removed.
  workers: 4
  job-lease: 5m
  planner:
    enabled: true
    from: "06:00"
    to: "18:00"
    interval: 10m
    snapshot-interval: 3h

search:
  workers: 1
  default-result-limit: 50
  enrichment-ttl: 24h
  gap-lookback-days: 30
  activity:
    active-days: 30
    low-activity-days: 180

traffic:
  # Administration pages the owner opens, not pages a reader arrives at. Issues, pull requests and
  # discussions stay visible: outsiders read them, and their visitor counts show it.
  service-paths:
    - graphs
    - pulse
    - actions
    - settings
    - network
    - stargazers
    - watchers
    - branches
    - tags
    - compare
    - security
    - community
    - activity
    - forks
    - deployments
    - wiki

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: readinessState,db
    prometheus:
      enabled: true
    env:
      enabled: false
    configprops:
      enabled: false
    heapdump:
      enabled: false
    threaddump:
      enabled: false
    logfile:
      enabled: false
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level traceId=%X{traceId} repositoryId=%X{repositoryId} collectionRunId=%X{collectionRunId} collectionJobId=%X{collectionJobId} searchRunId=%X{searchRunId} %logger{36} - %msg%n"
  level:
    com.kholodilin.repogrowth: INFO
    org.springframework.web.client: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    # Must match org.webjars:swagger-ui (see swagger-ui.version in backend/pom.xml).
    version: @swagger-ui.version@

# Rank-sort frozen into SEARCH_QUERY / TOPIC_WATCH parameters (collector.search.*).
# Collector GitHub execution is not started in this process — use the standalone boot JAR.
collector:
  search:
    rank-sort: best_match
    rank-sort-order: desc
