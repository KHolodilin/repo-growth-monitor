spring:
  application:
    name: repo-growth-monitor
  datasource:
    url: jdbc:postgresql://localhost:5432/repogrowth
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: ${AUTH_SESSION_IDLE:8h}

app:
  timezone: UTC

auth:
  provider: ${AUTH_PROVIDER:}
  production: ${AUTH_PRODUCTION:false}
  session-idle: ${AUTH_SESSION_IDLE:8h}
  session-absolute: ${AUTH_SESSION_ABSOLUTE:24h}
  oidc:
    issuer-uri: ${AUTH_OIDC_ISSUER_URI:}
    client-id: ${AUTH_OIDC_CLIENT_ID:}
    client-secret: ${AUTH_OIDC_CLIENT_SECRET:}
    redirect-uri: ${AUTH_OIDC_REDIRECT_URI:}
    scope: ${AUTH_OIDC_SCOPE:openid profile email}
  mock:
    users-location: ${AUTH_MOCK_USERS_LOCATION:classpath:auth/mock-users.yml}

github:
  token: ${GITHUB_TOKEN:}
  api-base-url: https://api.github.com
  web-base-url: https://github.com
  connect-timeout: 10s
  read-timeout: 30s

collection:
  workers: 4
  job-lease: 5m
  planner:
    enabled: true
    from: "06:00"
    to: "18:00"
    interval: 10m
    snapshot-interval: 3h

search:
  workers: 1
  default-result-limit: 50
  enrichment-ttl: 24h
  gap-lookback-days: 30
  activity:
    active-days: 30
    low-activity-days: 180

traffic:
  # Administration pages the owner opens, not pages a reader arrives at. Issues, pull requests and
  # discussions stay visible: outsiders read them, and their visitor counts show it.
  service-paths:
    - graphs
    - pulse
    - actions
    - settings
    - network
    - stargazers
    - watchers
    - branches
    - tags
    - compare
    - security
    - community
    - activity
    - forks
    - deployments
    - wiki

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level traceId=%X{traceId} repositoryId=%X{repositoryId} collectionRunId=%X{collectionRunId} collectionJobId=%X{collectionJobId} searchRunId=%X{searchRunId} %logger{36} - %msg%n"
  level:
    com.kholodilin.repogrowth: INFO
    org.springframework.web.client: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
