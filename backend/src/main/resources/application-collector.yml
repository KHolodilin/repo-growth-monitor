# Legacy combined-process collector profile. Prefer the standalone github-collector boot JAR.
rgm:
  web:
    enabled: false
  collector:
    enabled: true
  planner:
    enabled: false
spring:
  banner:
    location: classpath:banner-collector.txt
  main:
    web-application-type: none
  liquibase:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState

collector:
  runtime:
    enabled: ${COLLECTOR_RUNTIME_ENABLED:true}
  capacity:
    max-jobs: ${COLLECTOR_CAPACITY_MAX_JOBS:100}
    max-in-flight: ${COLLECTOR_CAPACITY_MAX_IN_FLIGHT:4}
    max-queue-bytes: ${COLLECTOR_CAPACITY_MAX_QUEUE_BYTES:67108864}
    max-request-bytes: ${COLLECTOR_CAPACITY_MAX_REQUEST_BYTES:262144}
    near-capacity-ratio: ${COLLECTOR_CAPACITY_NEAR_RATIO:0.8}
