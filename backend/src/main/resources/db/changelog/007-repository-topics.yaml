databaseChangeLog:
  - changeSet:
      id: 007-repository-topics
      author: repo-growth-monitor
      changes:
        - sql:
            sql: |
              CREATE TABLE repository_topic (
                  repository_id BIGINT NOT NULL REFERENCES repository (id) ON DELETE CASCADE,
                  name          TEXT NOT NULL,
                  PRIMARY KEY (repository_id, name)
              );

              CREATE INDEX idx_repository_topic_name ON repository_topic (name);
