databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: repo-growth-monitor
      changes:
        - sql:
            sql: |
              CREATE TABLE github_owner (
                  id              BIGSERIAL PRIMARY KEY,
                  github_id       BIGINT NOT NULL,
                  login           TEXT NOT NULL,
                  owner_type      TEXT NOT NULL,
                  avatar_url      TEXT,
                  html_url        TEXT,
                  created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  updated_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_github_owner_github_id UNIQUE (github_id),
                  CONSTRAINT ck_github_owner_type CHECK (owner_type IN ('USER', 'ORGANIZATION'))
              );

              CREATE TABLE repository (
                  id                  BIGSERIAL PRIMARY KEY,
                  github_id           BIGINT NOT NULL,
                  owner_id            BIGINT NOT NULL REFERENCES github_owner (id),
                  name                TEXT NOT NULL,
                  full_name           TEXT NOT NULL,
                  description         TEXT,
                  visibility          TEXT NOT NULL,
                  default_branch      TEXT,
                  language            TEXT,
                  fork                BOOLEAN NOT NULL DEFAULT FALSE,
                  archived            BOOLEAN NOT NULL DEFAULT FALSE,
                  stars               INTEGER NOT NULL DEFAULT 0,
                  forks               INTEGER NOT NULL DEFAULT 0,
                  open_issues         INTEGER NOT NULL DEFAULT 0,
                  tracking_enabled    BOOLEAN NOT NULL DEFAULT FALSE,
                  github_created_at   TIMESTAMPTZ,
                  github_updated_at   TIMESTAMPTZ,
                  created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  updated_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_repository_github_id UNIQUE (github_id)
              );

              CREATE INDEX idx_repository_owner_id ON repository (owner_id);
              CREATE INDEX idx_repository_tracking ON repository (tracking_enabled);
