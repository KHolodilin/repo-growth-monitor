databaseChangeLog:
  - changeSet:
      id: 003-collection-queue
      author: repo-growth-monitor
      changes:
        - sql:
            sql: |
              CREATE TABLE collection_run (
                  id                  BIGSERIAL PRIMARY KEY,
                  repository_id       BIGINT NOT NULL REFERENCES repository (id),
                  business_date       DATE NOT NULL,
                  status              TEXT NOT NULL,
                  planned_jobs        INTEGER NOT NULL DEFAULT 0,
                  successful_jobs     INTEGER NOT NULL DEFAULT 0,
                  failed_jobs         INTEGER NOT NULL DEFAULT 0,
                  created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  completed_at        TIMESTAMPTZ,
                  CONSTRAINT uq_collection_run_repo_date UNIQUE (repository_id, business_date)
              );

              CREATE INDEX idx_collection_run_repo_date ON collection_run (repository_id, business_date DESC);

              CREATE TABLE collection_job (
                  id                  BIGSERIAL PRIMARY KEY,
                  collection_run_id   BIGINT NOT NULL REFERENCES collection_run (id),
                  repository_id       BIGINT NOT NULL REFERENCES repository (id),
                  job_type            TEXT NOT NULL,
                  business_date       DATE NOT NULL,
                  status              TEXT NOT NULL,
                  attempt             INTEGER NOT NULL DEFAULT 0,
                  next_attempt_at     TIMESTAMPTZ,
                  locked_by           TEXT,
                  locked_until        TIMESTAMPTZ,
                  started_at          TIMESTAMPTZ,
                  completed_at        TIMESTAMPTZ,
                  error_code          TEXT,
                  error_message       TEXT,
                  created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  updated_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_collection_job_repo_date_type UNIQUE (repository_id, business_date, job_type)
              );

              CREATE INDEX idx_collection_job_claim
                  ON collection_job (status, next_attempt_at, locked_until);
              CREATE INDEX idx_collection_job_run ON collection_job (collection_run_id);
