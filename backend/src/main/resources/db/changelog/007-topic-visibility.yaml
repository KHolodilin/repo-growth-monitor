databaseChangeLog:
  - changeSet:
      id: 007-topic-visibility
      author: repo-growth-monitor
      changes:
        - sql:
            sql: |
              CREATE TABLE topic_watch (
                  id              BIGSERIAL PRIMARY KEY,
                  repository_id   BIGINT NOT NULL REFERENCES repository (id) ON DELETE CASCADE,
                  topic           TEXT NOT NULL,
                  language        TEXT,
                  sort            TEXT NOT NULL DEFAULT 'stars',
                  sort_order      TEXT NOT NULL DEFAULT 'desc',
                  enabled         BOOLEAN NOT NULL DEFAULT TRUE,
                  result_limit    INTEGER NOT NULL DEFAULT 50,
                  created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  updated_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
              );

              CREATE UNIQUE INDEX uq_topic_watch_repo_topic_language
                  ON topic_watch (repository_id, lower(topic), coalesce(lower(language), ''));

              CREATE INDEX idx_topic_watch_repo ON topic_watch (repository_id);

              CREATE TABLE topic_run (
                  id                              BIGSERIAL PRIMARY KEY,
                  topic_watch_id                  BIGINT NOT NULL REFERENCES topic_watch (id) ON DELETE CASCADE,
                  repository_id                   BIGINT NOT NULL REFERENCES repository (id) ON DELETE CASCADE,
                  business_date                   DATE NOT NULL,
                  status                          TEXT NOT NULL,
                  attempt                         INTEGER NOT NULL DEFAULT 0,
                  next_attempt_at                 TIMESTAMPTZ,
                  locked_by                       TEXT,
                  locked_until                    TIMESTAMPTZ,
                  started_at                      TIMESTAMPTZ,
                  completed_at                    TIMESTAMPTZ,
                  snapshot_at                     TIMESTAMPTZ,
                  total_count                     INTEGER,
                  tracked_repository_position     INTEGER,
                  error_code                      TEXT,
                  error_message                   TEXT,
                  created_at                      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  updated_at                      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                  CONSTRAINT uq_topic_run_watch_date UNIQUE (topic_watch_id, business_date)
              );

              CREATE INDEX idx_topic_run_claim
                  ON topic_run (status, next_attempt_at, locked_until);
              CREATE INDEX idx_topic_run_watch_date
                  ON topic_run (topic_watch_id, business_date DESC);

              CREATE TABLE topic_result (
                  id                      BIGSERIAL PRIMARY KEY,
                  topic_run_id            BIGINT NOT NULL REFERENCES topic_run (id) ON DELETE CASCADE,
                  position                INTEGER NOT NULL,
                  github_repository_id    BIGINT NOT NULL,
                  full_name               TEXT NOT NULL,
                  owner                   TEXT NOT NULL,
                  stars                   INTEGER NOT NULL,
                  watchers                INTEGER NOT NULL DEFAULT 0,
                  forks                   INTEGER NOT NULL,
                  language                TEXT,
                  description             TEXT,
                  html_url                TEXT,
                  CONSTRAINT uq_topic_result_run_position UNIQUE (topic_run_id, position)
              );

              CREATE INDEX idx_topic_result_run ON topic_result (topic_run_id);
