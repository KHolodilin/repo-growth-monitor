# Optional external configuration; do not add real credentials to this file.
# Select the relevant settings for RGM and for each Collector deployment.
rgm:
  credentials:
    enabled: true
    active-key-id: primary
    encryption-keys:
      primary: ${RGM_CREDENTIALS_KEY_PRIMARY}
    cache-lease: ${RGM_CREDENTIALS_CACHE_LEASE:2h}
  orchestration:
    nodes:
      - key: collector-a
        pool: default
        endpoint: ${COLLECTOR_A_URL}
        enabled: true
        service-token: ${COLLECTOR_A_ACCEPT_TOKEN}
        resolve-token: ${COLLECTOR_A_RESOLVE_TOKEN}
collector:
  credentials:
    enabled: true
    ttl: ${COLLECTOR_CREDENTIALS_TTL:2h}
    maximum-size: ${COLLECTOR_CREDENTIALS_MAXIMUM_SIZE:100}
    maximum-rejected: ${COLLECTOR_CREDENTIALS_MAXIMUM_REJECTED:1000}
    failure-backoff: ${COLLECTOR_CREDENTIALS_FAILURE_BACKOFF:5s}
    connect-timeout: 3s
    read-timeout: 10s
    allow-http: false
    origins:
      - origin: rgm
        endpoint: ${RGM_INTERNAL_URL}
        service-token: ${COLLECTOR_A_RESOLVE_TOKEN}
