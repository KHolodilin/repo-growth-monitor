version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The release workflow pins this image. A version bump belongs in a release, not a dependency PR.
      - dependency-name: ghcr.io/kholodilin/repo-growth-monitor
      # The Postgres volume is named for major 18. A major bump needs a manual migration.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
