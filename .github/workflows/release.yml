name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kholodilin/repo-growth-monitor:${{ steps.version.outputs.version }}
            ghcr.io/kholodilin/repo-growth-monitor:latest

      - name: Prepare Release assets
        run: |
          mkdir -p dist-release
          VERSION="${{ steps.version.outputs.version }}"
          sed "s|ghcr.io/kholodilin/repo-growth-monitor:0.29.0|ghcr.io/kholodilin/repo-growth-monitor:${VERSION}|g" \
            deploy/docker-compose.yml > dist-release/docker-compose.yml
          cp deploy/docker-compose.local.yml dist-release/docker-compose.local.yml
          cp deploy/Caddyfile dist-release/Caddyfile
          cp deploy/Caddyfile.local dist-release/Caddyfile.local
          cp deploy/.env.example dist-release/env.example
          cp deploy/README.md dist-release/README.md
          mkdir -p dist-release/postgres dist-release/sql
          cp deploy/postgres/init-runtime-role.sh dist-release/postgres/
          cp deploy/sql/runtime-grants.md dist-release/sql/
          (cd dist-release && tar -czf ../deploy-pack.tgz .)
          mv deploy-pack.tgz dist-release/

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            dist-release/deploy-pack.tgz
            dist-release/docker-compose.yml
            dist-release/docker-compose.local.yml
            dist-release/env.example
            dist-release/Caddyfile.local
            dist-release/README.md
          body: |
            Download the deploy pack. Java, Node, and a git clone are not required.

            Without a domain (HTTP on port 80):

            ```bash
            curl -fsSL -o deploy-pack.tgz https://github.com/KHolodilin/repo-growth-monitor/releases/latest/download/deploy-pack.tgz
            mkdir -p repo-growth-monitor && tar -xzf deploy-pack.tgz -C repo-growth-monitor
            cd repo-growth-monitor
            cp env.example .env
            # set GITHUB_TOKEN, POSTGRES_PASSWORD, POSTGRES_RUNTIME_PASSWORD
            docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
            ```

            Open http://localhost/ (or http://&lt;vps-ip&gt;/).

            Actuator stays on the host loopback only: http://127.0.0.1:8081/actuator/health

            See README.md in the pack for HTTPS/domain, CLI, and SSH tunnel examples.

            Upgrade: replace the pack files from a newer Release and run `docker compose … up -d` again. Postgres data stays in the volume.
